<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Партнёрский кабинет - Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="auth-box">
      <h1>🔐 Партнёрский кабинет</h1>

      <!-- Форма входа -->
      <div id="loginForm" class="form-container">
        <h2>Вход</h2>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email:</label>
            <input type="email" id="loginEmail" required>
          </div>
          <div class="form-group">
            <label>Пароль:</label>
            <input type="password" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <p class="switch-form">
          Нет аккаунта? <a href="#" onclick="showRegister()">Регистрация</a>
        </p>
      </div>

      <!-- Форма регистрации -->
      <div id="registerForm" class="form-container" style="display: none;">
        <h2>Регистрация</h2>
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Имя:</label>
            <input type="text" id="registerName" required>
          </div>
          <div class="form-group">
            <label>Email:</label>
            <input type="email" id="registerEmail" required>
          </div>
          <div class="form-group">
            <label>Телефон (опционально):</label>
            <input type="tel" id="registerPhone">
          </div>
          <div class="form-group">
            <label>Пароль:</label>
            <input type="password" id="registerPassword" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>
        <p class="switch-form">
          Есть аккаунт? <a href="#" onclick="showLogin()">Войти</a>
        </p>
      </div>

      <div id="message" class="message"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    function showRegister() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
    }

    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        showMessage('Вход...', 'info');
        const result = await API.loginPartner(email, password);

        // Сохранить сессию
        localStorage.setItem('sessionToken', result.sessionToken);
        localStorage.setItem('partner', JSON.stringify(result.partner));

        showMessage('Успешно! Перенаправление...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (error) {
        showMessage('Ошибка: ' + error.message, 'error');
      }
    }

    async function handleRegister(event) {
      event.preventDefault();

      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const phone = document.getElementById('registerPhone').value;
      const password = document.getElementById('registerPassword').value;

      try {
        showMessage('Регистрация...', 'info');
        const result = await API.registerPartner(email, password, name, phone);

        // Сохранить сессию
        localStorage.setItem('sessionToken', result.sessionToken);
        localStorage.setItem('partner', JSON.stringify(result.partner));

        showMessage('Регистрация успешна! Перенаправление...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (error) {
        showMessage('Ошибка: ' + error.message, 'error');
      }
    }

    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
      messageEl.style.display = 'block';
    }
  </script>
</body>
</html>
